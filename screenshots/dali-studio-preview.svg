<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Window Header -->
  <rect x="30" y="30" width="1140" height="50" rx="8" fill="#0f172a"/>
  <circle cx="55" cy="55" r="7" fill="#ef4444"/>
  <circle cx="75" cy="55" r="7" fill="#f59e0b"/>
  <circle cx="95" cy="55" r="7" fill="#10b981"/>
  <text x="125" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">DALIForge Pro v1.0.0 — Commercial DALI-2 &amp; D4i (IEC 62386) Protocol Studio</text>
  <rect x="990" y="42" width="160" height="26" rx="4" fill="#f59e0b"/>
  <text x="1005" y="59" fill="#0b1120" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">WIRESHARK PCAP (DALI)</text>

  <!-- Main Navigation Tabs -->
  <rect x="30" y="90" width="1140" height="45" fill="#070a13"/>
  <rect x="40" y="95" width="170" height="35" rx="6" fill="#f59e0b"/>
  <text x="55" y="118" fill="#0b1120" font-family="sans-serif" font-size="13" font-weight="700">1. Frame Dissector</text>

  <rect x="220" y="95" width="220" height="35" rx="6" fill="#0f172a"/>
  <text x="235" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">2. DAPC &amp; Dimming Studio</text>

  <rect x="450" y="95" width="210" height="35" rx="6" fill="#0f172a"/>
  <text x="465" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">3. DT8 Colour &amp; D4i Energy</text>

  <rect x="670" y="95" width="220" height="35" rx="6" fill="#0f172a"/>
  <text x="685" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">4. Safety Auditor</text>

  <rect x="900" y="95" width="200" height="35" rx="6" fill="#0f172a"/>
  <text x="915" y="118" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="500">5. Gateway Firewall</text>

  <!-- Left Column: Controls Card -->
  <rect x="30" y="150" width="550" height="510" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="55" y="185" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">16-Bit DALI Forward Frame &amp; Dimming Engine</text>

  <!-- Form Fields -->
  <rect x="55" y="210" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="65" y="235" fill="#64748b" font-family="sans-serif" font-size="12">Targeting: <tspan fill="#f59e0b" font-weight="600">Broadcast (All Gear)</tspan></text>

  <rect x="315" y="210" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="325" y="235" fill="#64748b" font-family="sans-serif" font-size="12">Function: <tspan fill="#06b6d4" font-weight="600">DAPC (Arc Level 254)</tspan></text>

  <rect x="55" y="265" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="65" y="290" fill="#64748b" font-family="sans-serif" font-size="12">Logarithmic Output: <tspan fill="#10b981" font-weight="600">100.0% (10^2)</tspan></text>

  <rect x="315" y="265" width="240" height="40" rx="6" fill="#050811" stroke="#334155"/>
  <text x="325" y="290" fill="#64748b" font-family="sans-serif" font-size="12">Linear Light Output: <tspan fill="#06b6d4" font-weight="600">100.0%</tspan></text>

  <!-- Formula Callout -->
  <rect x="55" y="325" width="500" height="50" rx="6" fill="#070a13" stroke="#f59e0b" stroke-width="1"/>
  <text x="70" y="347" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">IEC 62386-102 Logarithmic Dimming Formula:</text>
  <text x="70" y="365" fill="#cbd5e1" font-family="monospace" font-size="12">Light Output (%) = 10^( (3 * (X - 1) / 253) - 1 ) (Level 254 = 100%)</text>

  <!-- Hex Stream Box -->
  <rect x="55" y="395" width="500" height="150" rx="6" fill="#03050c" stroke="#1e293b"/>
  <text x="70" y="420" fill="#64748b" font-family="monospace" font-size="12">// Raw DALI 16-Bit Forward Frame (2 Bytes):</text>
  <text x="70" y="445" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="700">FE FE</text>
  <text x="70" y="475" fill="#94a3b8" font-family="monospace" font-size="12">Manchester Half-Bits (32 half-bits + 1 start + 2 stop):</text>
  <text x="70" y="495" fill="#06b6d4" font-family="monospace" font-size="11">01 01 01 01 01 01 01 10 01 01 01 01 01 01 01 10</text>
  <text x="70" y="525" fill="#10b981" font-family="monospace" font-size="12">✓ 1200 Baud | Duration: 15.0 ms | Level: 254 (100% Light Output)</text>

  <!-- Action Buttons -->
  <rect x="55" y="570" width="235" height="42" rx="6" fill="url(#accentGrad)"/>
  <text x="95" y="596" fill="#0b1120" font-family="sans-serif" font-size="13" font-weight="700">SYNTHESIZE FRAME</text>

  <rect x="310" y="570" width="245" height="42" rx="6" fill="#334155"/>
  <text x="345" y="596" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">EXPORT TO PCAP (51820)</text>

  <!-- Right Column: Dissection & Audit Summary -->
  <rect x="610" y="150" width="560" height="510" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
  <text x="635" y="185" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Real-Time Wire Dissection &amp; Compliance Card</text>

  <!-- Decoded Layers Tree -->
  <rect x="635" y="210" width="510" height="85" rx="6" fill="#03050c" stroke="#1e293b"/>
  <text x="650" y="235" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">Address Byte Decoding (IEC 62386-102)</text>
  <text x="650" y="255" fill="#94a3b8" font-family="sans-serif" font-size="12">Raw: 0xFE | Target: Broadcast to All Control Gear</text>
  <text x="650" y="275" fill="#94a3b8" font-family="sans-serif" font-size="12">Selector Bit (S): 0 (Direct Arc Power Control)</text>

  <rect x="635" y="310" width="510" height="115" rx="6" fill="#03050c" stroke="#1e293b"/>
  <text x="650" y="335" fill="#06b6d4" font-family="sans-serif" font-size="13" font-weight="700">DAPC Dimming &amp; DT8 Colour Telemetry</text>
  <text x="650" y="355" fill="#94a3b8" font-family="sans-serif" font-size="12">Arc Power Level: 254 (0xFE) | Fade Rate: Default (44.7 steps/s)</text>
  <text x="650" y="375" fill="#94a3b8" font-family="sans-serif" font-size="12">DT8 Circadian White: 4000 K (250 mirek) | D4i Active Energy: 100.0 kWh</text>
  <text x="650" y="398" fill="#10b981" font-family="monospace" font-size="13" font-weight="700">Logarithmic Output: 100.0% | Status: Normal Luminaire Operation</text>

  <!-- Security Audit Card -->
  <rect x="635" y="440" width="510" height="200" rx="6" fill="#040711" stroke="#334155"/>
  <text x="650" y="465" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">IEC 62386 &amp; Life-Safety Posture</text>
  <rect x="1040" y="450" width="90" height="24" rx="4" fill="#10b981"/>
  <text x="1055" y="467" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">SCORE: 80%</text>

  <text x="650" y="495" fill="#10b981" font-family="sans-serif" font-size="12">✓ DALI-SEC-02: Automated Emergency Lighting Testing Active (Pass)</text>
  <text x="650" y="520" fill="#10b981" font-family="sans-serif" font-size="12">✓ DALI-SEC-04: Runtime Commissioning Address Lockout Enforced (Pass)</text>
  <text x="650" y="545" fill="#ef4444" font-family="sans-serif" font-size="12">✗ DALI-SEC-01: Unfiltered Broadcast Blackout (0xFE 0x00) Forwarding Permitted</text>
  <text x="650" y="570" fill="#ef4444" font-family="sans-serif" font-size="12">✗ DALI-SEC-06: Rapid Stroboscopic Cycling Unprotected (Photoepilepsy Risk)</text>
  <text x="650" y="605" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="600">Lighting Defense: 2 nftables conduit rules &amp; 4 Suricata signatures available</text>
</svg>