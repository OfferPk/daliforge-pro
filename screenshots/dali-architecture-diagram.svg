<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="650" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="50" y="55" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="700">DALIForge Pro — Architecture &amp; Smart Lighting Protocol Stack</text>
  <text x="50" y="80" fill="#94a3b8" font-family="sans-serif" font-size="14">IEC 62386 (DALI-2 / D4i), Manchester Bi-Phase, &amp; Smart Building Cybersecurity</text>

  <!-- Protocol Layer Stack -->
  <rect x="50" y="110" width="480" height="490" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="75" y="145" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">DALI Protocol Layer Encapsulation</text>

  <!-- Layer 7b -->
  <rect x="75" y="165" width="430" height="80" rx="6" fill="#b45309" stroke="#f59e0b"/>
  <text x="90" y="190" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 7b: D4i Luminaire Memory Banks (Parts 251-253)</text>
  <text x="90" y="210" fill="#fef3c7" font-family="sans-serif" font-size="12">Bank 201: OEM GTIN / Asset ID | Bank 202: Active Energy (Wh/kWh)</text>
  <text x="90" y="228" fill="#fef3c7" font-family="sans-serif" font-size="12">Bank 203: Operating Hours, Diagnostic Counter, Temperature (°C)</text>

  <!-- Layer 7a -->
  <rect x="75" y="255" width="430" height="80" rx="6" fill="#0369a1" stroke="#0ea5e9"/>
  <text x="90" y="280" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 7a: DALI-2 Application Protocol (IEC 62386-102/209)</text>
  <text x="90" y="300" fill="#bae6fd" font-family="sans-serif" font-size="12">16-Bit Forward Frame: [Address Byte (8b)] [Data / Opcode (8b)]</text>
  <text x="90" y="318" fill="#bae6fd" font-family="sans-serif" font-size="12">Addressing: Short (0-63), Group (0-15), Broadcast (0xFE/0xFF)</text>

  <!-- Layer 2 -->
  <rect x="75" y="345" width="430" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="90" y="370" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Layer 2: Manchester Bi-Phase Modulation (IEC 62386-101)</text>
  <text x="90" y="390" fill="#cbd5e1" font-family="sans-serif" font-size="12">1200 Baud (+/- 10%) | Bit Period: 833.3 us | Half-Bit: 416.7 us</text>

  <!-- Layer 1 -->
  <rect x="75" y="420" width="430" height="70" rx="6" fill="#040711" stroke="#334155"/>
  <text x="90" y="445" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">Layer 1: Two-Wire Polarity-Free Bus</text>
  <text x="90" y="465" fill="#94a3b8" font-family="sans-serif" font-size="12">16V DC Nominal Bus Power Supply (11.5V - 20.5V operating window)</text>
  <text x="90" y="480" fill="#94a3b8" font-family="sans-serif" font-size="11">Maximum Bus Current: 250 mA | Up to 64 Control Gear per Loop</text>

  <!-- Engine Modules -->
  <rect x="560" y="110" width="490" height="490" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="585" y="145" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">DALIForge Pro Engine Modules</text>

  <rect x="585" y="165" width="440" height="70" rx="6" fill="#050811" stroke="#f59e0b"/>
  <text x="600" y="190" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">DALIProtocolEngine (JS &amp; Python CLI)</text>
  <text x="600" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12">• 16-bit Manchester bi-phase codec &amp; DAPC logarithmic curves</text>
  <text x="600" y="226" fill="#94a3b8" font-family="sans-serif" font-size="12">• DT8 Tunable White mirek converter, D4i energy parser, Libpcap</text>

  <rect x="585" y="245" width="440" height="70" rx="6" fill="#050811" stroke="#f59e0b"/>
  <text x="600" y="270" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">DALISecurityAuditor (Smart Building Safety)</text>
  <text x="600" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">• 10-point audit matrix (Broadcast blackout defense, emergency tests)</text>
  <text x="600" y="306" fill="#94a3b8" font-family="sans-serif" font-size="12">• Commissioning lockout, D4i energy integrity, stroboscopic safety</text>

  <rect x="585" y="325" width="440" height="70" rx="6" fill="#050811" stroke="#f59e0b"/>
  <text x="600" y="350" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="700">DALIConfigSynthesizer (Defense Generator)</text>
  <text x="600" y="370" fill="#94a3b8" font-family="sans-serif" font-size="12">• Linux nftables lighting conduit rules (BACnet 47808 / DALI 51820)</text>
  <text x="600" y="386" fill="#94a3b8" font-family="sans-serif" font-size="12">• Suricata L7 signatures for broadcast blackout &amp; stroboscopic abuse</text>

  <rect x="585" y="405" width="440" height="75" rx="6" fill="#050811" stroke="#334155"/>
  <text x="600" y="430" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">Universal Delivery Formats</text>
  <text x="600" y="450" fill="#94a3b8" font-family="sans-serif" font-size="12">• Zero-dependency HTML5 Web Studio (offline air-gap ready)</text>
  <text x="600" y="468" fill="#94a3b8" font-family="sans-serif" font-size="12">• Standalone Python 3 CLI (`daliforge-cli.py`, executable)</text>

  <!-- Bottom Badge -->
  <rect x="585" y="495" width="440" height="80" rx="6" fill="#070a13" stroke="#10b981"/>
  <text x="600" y="525" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="700">✓ Target Commercial Ecosystems Supported:</text>
  <text x="600" y="545" fill="#f8fafc" font-family="sans-serif" font-size="12">Tridonic, Signify/Philips, Helvar, Osram, Lutron, Zumtobel, Casambi</text>
  <text x="600" y="563" fill="#94a3b8" font-family="sans-serif" font-size="11">DALI-2 LED Drivers (DT6), Colour Control (DT8), D4i Sensors &amp; Energy</text>
</svg>